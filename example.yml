## example configuration for the inventory
## copy this file as 'config.yml' and replace the values with your own
---
# (hash)
# the list of puppetdb servers to query, must contain at least one entry
puppetdb_servers:
  server1:
    hostname: yy-puppetdb02.us-midwest-1.nexcess.net
    port: 8080
    ssl: false
    cacert: /path/to/ca/cert
    cert: /path/to/server/cert
    key: /path/to/server/key

# (list)
# rules that set 'ansible_python_interpreter' on a host when its Puppet facts
# match.  Each rule needs a 'path' (the interpreter to use) and a 'when' hash of
# fact name => expected value.  Every fact in 'when' must match for the rule to
# apply, and the first matching rule wins.  A value can also be a list, in which
# case any one of them matching is enough.  Comparisons are case-insensitive.
# Only the facts named here are queried from PuppetDB, so leave this out
# entirely if you don't need it.
python_interpreters:
  # CentOS 6 has no python3, and its python2 lives at an unversioned path that
  # Ansible's default interpreter discovery does not pick reliably
  - path: /usr/bin/python2.7
    when:
      operatingsystem: CentOS
      operatingsystemmajrelease: 6

# (bool) whether to use redis for caching
use_redis: false

# (str) the host to use when connecting to redis
redis_host: '127.0.0.1'

# (int) the port to use when connecting to redis
redis_port: 6379

# (int) the redis index to use for storage
redis_index: 0

# (int) the time in seconds to consider cached data valid
redis_ttl: 86400

# (str) the "mode" the script is in
# 'development' mode = cache the results of http requests to puppetdb to a local
#   file this is useful for development since you don't have to wait for
#   the http requests every time
# 'production' mode  = make fresh http requests to puppetdb every time
mode: 'production'
